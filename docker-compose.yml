# Sparkline In-House LLM + RAG System
# All services run locally — no external APIs.
# GPU support for Ollama is toggled via the `ollama` profile.
# Usage:
#   CPU-only:  docker compose up -d
#   With GPU:  docker compose --profile gpu up -d
#
# ── Port binding: only the two front doors face the network ──────────────────
# Every datastore below binds to 127.0.0.1. They previously bound 0.0.0.0, which
# published them to the whole office LAN, and on 2026-08-19 a laptop on that LAN
# read document text straight out of Qdrant with no credentials. Access control
# is enforced by the application when it queries, so anything reaching a
# datastore directly is past the enforcement point and sees everything — which
# would make ABAC decorative the moment it is switched on.
#
# `api` and `open-webui` stay on 0.0.0.0 deliberately: they ARE the product, they
# authenticate, and the office is supposed to reach them.
#
# 127.0.0.1 rather than removing the ports entirely, because an SSH tunnel
# terminates on the server's loopback — so `ssh -L 16333:localhost:16333` keeps
# working for admin access and for integration tests, while nothing on the LAN
# can connect. Containers reach each other by service name over the compose
# network and never use these host ports at all.

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — shared metadata, users, audit log
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sparkline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sparkline}
      # No default. A fallback here is a password published in git that works,
      # which is how the server ended up running on the placeholder from
      # .env.example. Unset now stops the stack with a message instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sparkline_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sparkline} -d ${POSTGRES_DB:-sparkline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — session state (Document RAG only)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sparkline_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO — raw file storage with versioning
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sparkline_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # Qdrant — vector database (dense + sparse/BM25 native)
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sparkline_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Qdrant ships with no authentication whatsoever — this is opt-in, not a
      # setting that was misconfigured. Defence in depth behind the loopback
      # bind above: if a future edit republishes the port, the data does not
      # become readable by anyone who can reach it. Must match QDRANT_API_KEY in
      # .env, which is what the application client sends.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo >/dev/tcp/localhost/6333) 2>/dev/null && exit 0 || exit 1'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # Ollama — local LLM serving (CPU-only mode)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sparkline_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo >/dev/tcp/localhost/11434) 2>/dev/null && exit 0 || exit 1'"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ─────────────────────────────────────────────
  # Ollama — GPU-accelerated (profile: gpu)
  # Enable when RTX 5060 Ti is available:
  #   docker compose --profile gpu up -d
  # ─────────────────────────────────────────────
  ollama_gpu:
    image: ollama/ollama:latest
    container_name: sparkline_ollama_gpu
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo >/dev/tcp/localhost/11434) 2>/dev/null && exit 0 || exit 1'"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ─────────────────────────────────────────────
  # Sparkline FastAPI Gateway
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkline_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      LLM_BASE_URL: http://ollama:11434/v1
    volumes:
      - .:/app
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────────
  # Open WebUI — Chat Frontend
  # ─────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sparkline_webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      SPARKLINE_API_URL: http://host.docker.internal:8000
      ENABLE_SIGNUP: "true"
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  ollama_data:
  open_webui_data:
