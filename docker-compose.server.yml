# Server-specific override (shared GPU box, other tenants present).
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Two things this fixes:
#  1. .env sets host port mappings in a 1xxxx block to dodge other tenants,
#     but the app builds its connection URLs from those same vars. Pin the
#     in-network ports back to the real container ports here.
#  2. Ollama runs natively on the host (already GPU-attached, already holds the
#     downloaded model), so point at it via host-gateway rather than the
#     containerised ollama.
services:
  api:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      # Expose the GPU to the embedding and reranking models. The image already
      # ships a CUDA build of torch; without these two variables the nvidia
      # runtime maps no devices into the container and torch silently falls back
      # to CPU, where embedding a large workbook takes about an hour.
      #
      # This host runs the nvidia runtime as its default, so no device
      # reservation block is needed — the variables alone are what grant access.
      #
      # VRAM budget on the 16GB card: the embedding model is ~1.3GB and the
      # reranker ~0.1GB, alongside ~9GB for the LLM served by the host's Ollama.
      # To hand these models back to the CPU, set EMBEDDING_DEVICE and
      # RERANKER_DEVICE to 'cpu' in .env — no change is needed here.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Open WebUI's own database, read-only, so the reconciliation sweep can
      # see which chats still exist. Attachments have no expiry, so this is the
      # only thing that ever reclaims them: the sweep compares live chats
      # against the attachments held and deletes the difference.
      #
      # Read-only is not a formality — this is the frontend's live database and
      # nothing here has any business writing to it. Without this mount the
      # sweep aborts rather than deleting, which is the correct direction to
      # fail but means nothing is ever reclaimed.
      #
      # Compose merges volumes by container path, so the base file's `.:/app`
      # bind mount survives this. Verify with `docker compose config` after
      # editing: losing /app would leave the container with no source code.
      - open_webui_data:/webui-data:ro
  open-webui:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPARKLINE_API_URL: http://api:8000
